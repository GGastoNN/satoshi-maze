name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      GODOT_VERSION: "4.7.2"
      GODOT_RELEASE: "stable"

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android packages
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "build-tools;35.0.1" \
            "platforms;android-35" \
            "cmdline-tools;latest" \
            "cmake;3.10.2.4988404" \
            "ndk;28.1.13356709"

      - name: Install Godot editor and export templates
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p "$HOME/bin" "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" \
            -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/bin"
          mv "$HOME/bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"

          curl -L --fail --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" \
            -o /tmp/templates.tpz
          rm -rf /tmp/godot-templates
          mkdir -p /tmp/godot-templates
          unzip -q /tmp/templates.tpz -d /tmp/godot-templates
          cp -a /tmp/godot-templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/"

      - name: Configure Godot Android paths
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS

      - name: Validate every GDScript
        shell: bash
        run: |
          set +e
          failed=0
          : > /tmp/godot-script-check.log
          while IFS= read -r script; do
            echo "=== Checking ${script} ===" | tee -a /tmp/godot-script-check.log
            output="$(godot --headless --path . --check-only --script "${script}" 2>&1)"
            status=$?
            printf '%s\n' "$output" | tee -a /tmp/godot-script-check.log
            if [ "$status" -ne 0 ] || printf '%s\n' "$output" | grep -Eq "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR: Failed to load script"; then
              failed=1
            fi
          done < <(find scripts -type f -name '*.gd' -print | sort)
          if [ "$failed" -ne 0 ]; then
            echo "One or more GDScript files failed validation." >&2
            exit 1
          fi

      - name: Import and validate project
        shell: bash
        run: |
          set -o pipefail
          godot --headless --path . --import --quit 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|ERROR: Failed to load script" /tmp/godot-import.log; then
            echo "Godot reported script/import errors." >&2
            exit 1
          fi

      - name: Build APK
        shell: bash
        run: |
          mkdir -p build
          godot --headless --verbose --path . --export-debug "Android" build/SatoshiMaze.apk
          test -s build/SatoshiMaze.apk
          ls -lh build/SatoshiMaze.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: SatoshiMaze-Android
          path: build/SatoshiMaze.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release on tags
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --generate-notes
          gh release upload "${GITHUB_REF_NAME}" build/SatoshiMaze.apk --clobber
