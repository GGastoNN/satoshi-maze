name: Android Play Store AAB + APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK command-line tools
        shell: bash
        run: |
          set -euo pipefail
          SDK="$HOME/android-sdk"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          mkdir -p "$SDK/cmdline-tools/latest"
          curl -fLsS 'https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip' -o /tmp/android-commandline-tools.zip
          mkdir -p /tmp/android-commandline-tools
          unzip -q /tmp/android-commandline-tools.zip -d /tmp/android-commandline-tools
          cp -R /tmp/android-commandline-tools/cmdline-tools/. "$SDK/cmdline-tools/latest/"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$SDK" --licenses >/dev/null || test "${PIPESTATUS[1]}" -eq 0
          sdkmanager --sdk_root="$SDK" 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'

      - name: Install Godot and Android export templates
        env:
          VERSION: '4.7.2'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/bin" "$HOME/.local/share/godot/export_templates/$VERSION.stable"
          curl -fLsS "https://github.com/godotengine/godot/releases/download/$VERSION-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/bin"
          mv "$HOME/bin/Godot_v${VERSION}-stable_linux.x86_64" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fLsS "https://github.com/godotengine/godot/releases/download/$VERSION-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          mkdir -p /tmp/templates
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -R /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/$VERSION.stable/"

      - name: Configure export
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS

      - name: Import project and install Gradle Android template
        shell: bash
        run: |
          set -euo pipefail
          godot --headless --path . --import --quit
          TEMPLATE="$HOME/.local/share/godot/export_templates/4.7.2.stable/android_source.zip"
          test -s "$TEMPLATE" || { echo 'Missing android_source.zip'; exit 1; }
          mkdir -p android/build
          unzip -oq "$TEMPLATE" -d android/build
          printf '%s\n' '4.7.2.stable' > android/.build_version
          test -f android/build/gradlew || { echo 'Gradle template missing android/build/gradlew'; exit 1; }
          chmod +x android/build/gradlew
          echo 'Gradle Android build template installed.'

      - name: Export signed AAB and APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          test -n "$KEYSTORE_PASSWORD" || { echo 'Missing ANDROID_KEYSTORE_PASSWORD'; exit 1; }
          test -n "$KEY_ALIAS" || { echo 'Missing ANDROID_KEY_ALIAS'; exit 1; }
          test -n "$KEY_PASSWORD" || { echo 'Missing ANDROID_KEY_PASSWORD'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          chmod 600 /tmp/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
          mkdir -p build

          # Existing export preset is configured for AAB (export_format=1).
          godot --headless --path . --export-release Android build/SatoshiMaze.aab
          test -s build/SatoshiMaze.aab

          # Switch only the local export preset to APK (export_format=0).
          python3 - <<'PYCODE'
          from pathlib import Path
          p = Path('export_presets.cfg')
          data = p.read_text(encoding='utf-8')
          before = 'gradle_build/export_format=1'
          assert data.count(before) == 1, 'Expected one Android AAB export format setting'
          p.write_text(data.replace(before, 'gradle_build/export_format=0'), encoding='utf-8')
          PYCODE
          godot --headless --path . --export-release Android build/SatoshiMaze.apk
          test -s build/SatoshiMaze.apk
          echo 'AAB and APK exported successfully.'

      - name: Upload AAB for Play Store
        uses: actions/upload-artifact@v4
        with:
          name: SatoshiMaze-PlayStore-AAB
          path: build/SatoshiMaze.aab
          if-no-files-found: error

      - name: Upload APK for direct installation
        uses: actions/upload-artifact@v4
        with:
          name: SatoshiMaze-Android-APK
          path: build/SatoshiMaze.apk
          if-no-files-found: error
