name: Android Play Store AAB
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platform-tools' 'build-tools;35.0.1' 'platforms;android-35'
      - name: Install Godot and Android export templates
        env:
          VERSION: '4.7.2'
        run: |
          mkdir -p "$HOME/bin" "$HOME/.local/share/godot/export_templates/$VERSION.stable"
          curl -fLsS "https://github.com/godotengine/godot/releases/download/$VERSION-stable/Godot_v${VERSION}-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d "$HOME/bin"
          mv "$HOME/bin/Godot_v${VERSION}-stable_linux.x86_64" "$HOME/bin/godot"
          chmod +x "$HOME/bin/godot"
          echo "$HOME/bin" >> "$GITHUB_PATH"
          curl -fLsS "https://github.com/godotengine/godot/releases/download/$VERSION-stable/Godot_v${VERSION}-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/$VERSION.stable/"
      - name: Configure export
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.tres" <<SETTINGS
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/java_sdk_path = "${JAVA_HOME}"
          SETTINGS
      - name: Import and install Android build template
        run: |
          godot --headless --path . --import --quit
          godot --headless --path . --install-android-build-template --quit
      - name: Export AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing signing secrets'; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > /tmp/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH=/tmp/release.keystore
          export GODOT_ANDROID_KEYSTORE_RELEASE_USER="$KEY_ALIAS"
          export GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="$KEYSTORE_PASSWORD"
          mkdir -p build
          godot --headless --path . --export-release Android build/SatoshiMaze.aab
          test -s build/SatoshiMaze.aab
      - uses: actions/upload-artifact@v4
        with:
          name: SatoshiMaze-PlayStore-AAB
          path: build/SatoshiMaze.aab
